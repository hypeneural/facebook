name: MVP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app run.py scripts
      - run: python scripts/doctor.py --offline
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check_powershell_syntax.ps1
      - run: python -m pytest -q
      - run: python scripts/validate_report_directory.py
